<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QR Code avec téléchargement</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    .qr-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      margin: auto;
    }

    #qrcode {
      width: 300px;
      height: 300px;
      margin: auto;
    }

    .qr-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%);
      background: white;
      padding: 8px;
      border-radius: 14px;
    }

    .qr-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: #000;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>QR Code Site web Cabinet Idac</h2>

  <div class="qr-wrapper" id="qr-area">
    <div id="qrcode"></div>

    <div class="qr-logo">
      <img src="OIP (5).webp" alt="Logo">
    </div>
  </div>

  <button onclick="downloadPNG()">📥 Télécharger PNG</button>
  <button onclick="downloadPDF()">📄 Exporter PDF</button>
</div>

<!-- QRCode -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- jsPDF -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
  const url = "https://www.monsite.com"; // 🔗 ton site ici

  new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 330,
    height: 330,
    correctLevel: QRCode.CorrectLevel.H
  });

  function downloadPNG() {
    html2canvas(document.getElementById("qr-area")).then(canvas => {
      const link = document.createElement("a");
      link.download = "qr-code.png";
      link.href = canvas.toDataURL();
      link.click();
    });
  }

  async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("portrait", "mm", "a4");

    const canvas = await html2canvas(document.getElementById("qr-area"), {
      scale: 3
    });

    const imgData = canvas.toDataURL("image/png");

    const pageWidth = pdf.internal.pageSize.getWidth();
    const imgSize = 120;
    const x = (pageWidth - imgSize) / 2;
    const y = 60;

    pdf.addImage(imgData, "PNG", x, y, imgSize, imgSize);
    pdf.save("qr-code-impression.pdf");
  }
</script>

</body>
</html>
