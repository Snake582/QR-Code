<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>QR Code – Cabinet IDAC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --primary: #0d47ff;
      --dark: #000;
      --light: #fff;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--primary);
      color: var(--light);
      padding: 30px;
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .qr-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
      background: white;
      border-radius: var(--radius-md);
      padding: 10px;
    }

    #qrcode {
      width: 100%;
      height: 100%;
    }

    .qr-logo {
      position: absolute;
      inset: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background: white;
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .qr-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      background: var(--dark);
      color: var(--light);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* ===== MODE CARTE BLEUE POUR EXPORT PNG ===== */
.export-card {
  width: 360px !important;
  height: auto !important;
  padding: 25px !important;
  border-radius: 22px;
  background: linear-gradient(135deg, #0d47ff, #002fa7);
  box-shadow: 0 25px 45px rgba(0,0,0,0.35);
}

.export-card h2 {
  color: white;
}

.export-card .qr-wrapper {
  background: white;
}

.hide-for-export {
  display: none !important;
}
  </style>
</head>
<body>

  <main class="container">
    <h2>QR Code – Cabinet IDAC</h2>

    <div class="qr-wrapper" id="qr-area">
      <div id="qrcode"></div>

      <div class="qr-logo">
        <img src="OIP (5).webp" alt="Logo Cabinet IDAC">
      </div>
    </div>

    <div class="actions">
      <button id="pngBtn">📥 Télécharger PNG</button>
      <button id="pdfBtn">📄 Exporter PDF</button>
    </div>
  </main>

  <!-- QRCode -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script>
    const SITE_URL = "https://cabinet-idac-sarl.vercel.app/";
    const QR_AREA = document.getElementById("qr-area");

    new QRCode(document.getElementById("qrcode"), {
      text: SITE_URL,
      width: 300,
      height: 300,
      correctLevel: QRCode.CorrectLevel.H
    });

 document.getElementById("pngBtn").addEventListener("click", async () => {
  const card = document.querySelector(".container");
  const actions = document.querySelector(".actions");

  // Activer le mode carte
  card.classList.add("export-card");

  // Cacher les boutons
  actions.classList.add("hide-for-export");

  // Laisser le temps au DOM d'appliquer les styles
  await new Promise(resolve => setTimeout(resolve, 120));

  const canvas = await html2canvas(card, {
    scale: 3,
    backgroundColor: null
  });

  // Restaurer l'affichage normal
  card.classList.remove("export-card");
  actions.classList.remove("hide-for-export");

  const link = document.createElement("a");
  link.download = "qr-carte-cabinet-idac.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

    document.getElementById("pdfBtn").addEventListener("click", async () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("portrait", "mm", "a4");

      const canvas = await html2canvas(QR_AREA, { scale: 3 });
      const imgData = canvas.toDataURL("image/png");

      const pageWidth = pdf.internal.pageSize.getWidth();
      const imgSize = 120;
      const x = (pageWidth - imgSize) / 2;

      pdf.addImage(imgData, "PNG", x, 60, imgSize, imgSize);
      pdf.save("qr-code-cabinet-idac.pdf");
    });
  </script>

</body>
</html>
